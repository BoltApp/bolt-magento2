name: CI

# Migrated from CircleCI to GitHub Actions; `.circleci/` has since been deleted.
# Ports the PR-gating `build` workflow: phpcs + the Magento-integration matrix.
# CircleCI's other workflows were retired rather than ported -- all three were
# measurably dead (auto-rebase 0/13 green, its two target branches untouched
# since 2020; merchant-branch fan-out triggering pipelines for those same dead
# branches; the remote-trigger workflow never invoked).
#
# The nightly selenium suite stops running with that deletion too. It has been
# 0/88 green since April 2026 -- it drives a separate BoltApp/integration-tests
# repo through an ngrok tunnel, and that ngrok account was suspended. Reviving
# it means a GHA cron plus an ngrok replacement; Test/scripts/ci-integration.sh
# is kept as the recipe until that call is made.
#
# ---------------------------------------------------------------------------
# Why `docker run` instead of a job `container:`
#
# The boltdev/m2-installed-plugin-ci-* images ship Magento pre-installed, but
# they are ~7 years old and inherit circleci/php:7.x-…-legacy = Debian Stretch,
# glibc 2.24. GitHub Actions injects a Node 24 runtime into a job `container:`
# to run actions/checkout, and that Node needs GLIBC_2.28 / CXXABI_1.3.11 — so
# every job dies before a single test runs.
#
# Rebuilding the images on a modern base is NOT an option: Packagist has dropped
# its Composer 1 metadata API, and Magento 2.2.8 / 2.3.0 / 2.4.2 are all
# Composer-1-era (2.2.8 literally requires `composer/composer @alpha`). Their
# `composer create-project` can no longer resolve phpunit, php_codesniffer or
# composer itself from packagist.org, on any base image. The existing images
# survive only because they predate that change.
#
# So: check out and run the workflow on a modern ubuntu-latest host, and invoke
# the old image with `docker run`. GHA's Node never enters the container, and the
# images need no changes at all.
#
# Two hacks this also removes, versus running under `container:`:
#   - the repo is mounted straight at /home/circleci/project, which is exactly
#     where CircleCI put it (its default working_directory), so Test/scripts/*
#     find the pre-installed Magento as a sibling at ../magento unmodified
#   - `--network host` means MySQL really is on 127.0.0.1, as the scripts assume,
#     so no socat port-bridging is needed
# ---------------------------------------------------------------------------

on:
  pull_request:
  push:
    branches: [master]

jobs:
  phpcs:
    name: phpcs (Magento Coding Standard)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: cimg/mysql:5.7
        ports: ["3306:3306"]
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.GHA_DOCKER_USER }}
          password: ${{ secrets.GHA_DOCKER_PASSWORD }}

      - name: Magento Coding Standard
        run: |
          mkdir -p artifacts
          docker run --rm --network host --user root \
            -v "$PWD":/home/circleci/project -w /home/circleci/project \
            -e TEST_ENV=php72 \
            -e MAGENTO_VERSION=2.3.0 \
            -e XDEBUG_MODE=coverage \
            -e COMPOSER_MEMORY_LIMIT=5G \
            boltdev/m2-installed-plugin-ci-php72:2.3.0-v1 \
            bash -c 'Test/scripts/phpcs_meqp2.sh'

  integration:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Magento 2.2.8 (PHPUnit 6.2) and 2.3.0 (PHPUnit 6.5) were dropped from
      # this matrix: the suite now has to run on PHPUnit 12 for Magento 2.4.9,
      # and spanning PHPUnit 6 to 12 needs shims for APIs PHPUnit 6 lacks
      # (onlyMethods(), attributes). 2.4.2 on PHPUnit 9.1 is the oldest kept.
      matrix:
        include:
          - name: php74 / Magento 2.4.2
            image: boltdev/m2-installed-plugin-ci-php74:2.4.6
            php_version: php74
            magento_version: "2.4.2"
            mysql_image: cimg/mysql:8.0
    services:
      mysql:
        image: ${{ matrix.mysql_image }}
        ports: ["3306:3306"]
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.GHA_DOCKER_USER }}
          password: ${{ secrets.GHA_DOCKER_PASSWORD }}

      # Magento 2.4.2 needs Elasticsearch 7, which its image has installed and
      # install_magento.sh starts itself (`sudo service elasticsearch start`).
      # It is not a service container here; --network host covers it too.
      - name: Run Magento integration tests
        run: |
          mkdir -p artifacts
          docker run --rm --network host --user root \
            -v "$PWD":/home/circleci/project -w /home/circleci/project \
            -e TEST_ENV=${{ matrix.php_version }} \
            -e MAGENTO_VERSION=${{ matrix.magento_version }} \
            -e MAGENTO_DIR=magento \
            -e XDEBUG_MODE=coverage \
            -e COMPOSER_MEMORY_LIMIT=4G \
            ${{ matrix.image }} \
            bash -c 'Test/scripts/ci-magento-integration.sh'

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.php_version }}-${{ matrix.magento_version }}
          path: artifacts
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Latest Magento on the latest PHP.
  #
  # No pre-built image: Magento is cloned from its GitHub release tag and
  # installed with Composer 2 on the runner, so moving to a newer release means
  # changing MAGENTO_VERSION and php-version below, nothing else. The GitHub
  # monorepo resolves entirely from packagist.org, so no repo.magento.com keys
  # are needed.
  #
  # continue-on-error: Magento 2.4.9 ships PHPUnit 12, and most of Test/Unit
  # still targets PHPUnit 6-9 (@test annotations, setMethods(),
  # withConsecutive(), ...). The job reports those failures without blocking
  # merges until the suite is migrated.
  # ---------------------------------------------------------------------------
  integration-latest:
    name: php85 / Magento 2.4.9
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      MAGENTO_VERSION: "2.4.9"
    services:
      mysql:
        image: mysql:8.4
        ports: ["3306:3306"]
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
      opensearch:
        image: opensearchproject/opensearch:2
        ports: ["9200:9200"]
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd="curl -fs http://localhost:9200"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      # Test/scripts/* expect the plugin and Magento as sibling `project/` and
      # `magento/` directories, as on CircleCI.
      - uses: actions/checkout@v4
        with:
          path: project

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: bcmath, ftp, gd, intl, soap, sockets, sodium, xsl, zip, pdo_mysql
          ini-values: memory_limit=-1
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-magento-${{ env.MAGENTO_VERSION }}-php85

      - name: Install Magento ${{ env.MAGENTO_VERSION }}
        run: |
          git clone --quiet --depth 1 --branch "$MAGENTO_VERSION" https://github.com/magento/magento2.git magento
          cd magento
          composer install --no-interaction --no-progress
          # Plugin dependencies: it runs from app/code, not vendor/, so Composer
          # does not pull these in by itself
          composer require --no-interaction --no-progress bugsnag/bugsnag:^3.0 mikey179/vfsstream:^1.6

      - name: Run Magento integration tests
        working-directory: project
        run: |
          mkdir -p artifacts
          Test/scripts/ci-magento-integration.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-php85-${{ env.MAGENTO_VERSION }}
          path: project/artifacts
          if-no-files-found: ignore
